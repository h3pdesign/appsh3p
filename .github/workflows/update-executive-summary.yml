name: Update Executive Summary Monthly

on:
  schedule:
    # Run monthly at 04:00 UTC.
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: update-executive-summary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update Executive Summary + section card
        run: node scripts/update-executive-summary.mjs

      - name: Validate site after update
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/public/polymarket-us-politics; then
            echo "No summary change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/polymarket-us-politics
          git commit -m "Daily executive summary update from Polymarket"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
            git pull --rebase origin main
          done
