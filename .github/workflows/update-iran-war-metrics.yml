name: Update Iran/Ukraine conflict metrics and hotspots

on:
  schedule:
    - cron: '2 * * * *'
    - cron: '17 * * * *'
    - cron: '32 * * * *'
    - cron: '47 * * * *'
    - cron: '29 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iran-war-metrics
  cancel-in-progress: false

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update metrics JSON
        run: node scripts/update-iran-war-metrics.mjs

      - name: Validate site
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/public/polymarket-us-politics/data/iran-war-metrics.json; then
            echo "No metrics change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/polymarket-us-politics/data/iran-war-metrics.json
          git commit -m "Update Iran/Ukraine conflict hotspots"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
            git pull --rebase origin main
          done
