name: Update Iran war metrics

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update metrics JSON
        run: node scripts/update-iran-war-metrics.mjs

      - name: Validate site
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/public/polymarket-us-politics/data/iran-war-metrics.json; then
            echo "No metrics change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/polymarket-us-politics/data/iran-war-metrics.json
          git commit -m "Update Iran war metrics"
          git push
