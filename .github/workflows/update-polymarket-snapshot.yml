name: Update Polymarket snapshot

on:
  schedule:
    # GitHub cron is UTC + best-effort; run weekly.
    - cron: "3 0 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: update-polymarket-snapshot
  cancel-in-progress: true

jobs:
  update-polymarket-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Rebuild Polymarket snapshot
        run: sh scripts/update-polymarket-snapshot.sh

      - name: Validate site
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          SNAP="docs/public/polymarket-us-politics/data/polymarket-market-snapshot.json"
          META="docs/public/polymarket-us-politics/data/polymarket-snapshot-meta.json"

          if git diff --quiet -- "$SNAP" "$META"; then
            echo "No snapshot/meta change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$SNAP" "$META"
          git commit -m "Update Polymarket snapshot"

          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi

            echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
            git pull --rebase origin main
          done
