name: Site Guard

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Polymarket HTML + Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Fast-fail guard
        run: |
          test -f scripts/validate-polymarket-site.mjs || { echo "Missing scripts/validate-polymarket-site.mjs"; exit 1; }
          test -f docs/public/polymarket-us-politics/data/iran-war-metrics.json || { echo "Missing docs/public/polymarket-us-politics/data/iran-war-metrics.json"; exit 1; }
          test -f docs/public/polymarket-us-politics/data/polymarket-market-snapshot.json || { echo "Missing docs/public/polymarket-us-politics/data/polymarket-market-snapshot.json"; exit 1; }

      - name: Run validator
        run: node scripts/validate-polymarket-site.mjs

      - name: Check performance budget
        run: node scripts/check-performance-budget.mjs

      - name: Validate app catalog
        run: node scripts/validate-app-catalog.mjs
