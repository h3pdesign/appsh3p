name: Update Conflict News Ticker

on:
  schedule:
    - cron: '18 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: update-conflict-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update conflict news JSON
        run: node scripts/update-conflict-news.mjs

      - name: Validate site
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/public/polymarket-us-politics/data/conflict-news.json; then
            echo "No news change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/polymarket-us-politics/data/conflict-news.json
          git commit -m "Update conflict news ticker"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
            git pull --rebase origin main
          done
