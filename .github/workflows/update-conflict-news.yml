name: Update Conflict News Ticker

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update conflict news JSON
        run: node scripts/update-conflict-news.mjs

      - name: Validate site
        run: node scripts/validate-polymarket-site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/public/polymarket-us-politics/data/conflict-news.json; then
            echo "No news change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/polymarket-us-politics/data/conflict-news.json
          git commit -m "Update conflict news ticker"
          git push
