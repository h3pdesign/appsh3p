name: Preview docs on PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard workflow syntax and config
        id: workflow_guard
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest
          ./actionlint -color

      - name: Fail fast if workflow guard fails
        if: steps.workflow_guard.outcome == 'failure'
        run: |
          echo "::error::Workflow guard failed. One or more files in .github/workflows has invalid syntax or config."
          echo "::error::Fix workflow issues first, then re-run CI."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize and validate docs images
        run: npm run docs:images

      - name: Build docs
        run: npm run docs:build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-preview-${{ github.run_id }}
          path: docs/.vitepress/dist
          retention-days: 7
